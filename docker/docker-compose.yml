version: "3.8"

# NYC PolicyScope Lab — Local Development Stack
#
# Services:
#   n8n      — workflow orchestration (localhost:5678)
#   nanoclaw — Claude manager agent connected to Discord
#
# Usage:
#   1. Copy .env.example to .env and fill in all keys
#   2. Run: bash scripts/setup_nanoclaw.sh   (first time only)
#   3. cd docker && docker compose up -d
#   4. Open n8n: http://localhost:5678
#   5. Trigger nanoclaw in Discord with the configured trigger word

services:

  # ─── n8n: Workflow Orchestrator ────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: nycpolicyscope-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Basic auth to protect local instance
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-nycpolicy2026}

      # Timezone for NYC scheduling
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York

      # Disable telemetry
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false

      # Allow reading local files from mounted volumes
      - N8N_ALLOW_FILE_ACCESS_TO_PATHS=/data/sample,/data/output,/templates,/prompts,/schemas

      # Webhook base URL for local testing
      - WEBHOOK_URL=http://localhost:5678/

      # Webhook security token (used by nanoclaw to authenticate)
      - N8N_WEBHOOK_TOKEN=${N8N_WEBHOOK_TOKEN:-}

      # Pass through API keys needed by execute-command nodes
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - IMAGEN_MODEL=${IMAGEN_MODEL:-imagen-3.0-generate-002}
      - GHL_API_KEY=${GHL_API_KEY:-}
      - GHL_LOCATION_ID=${GHL_LOCATION_ID:-}
      - GHL_API_BASE=${GHL_API_BASE:-https://services.leadconnectorhq.com}

    volumes:
      # Persist n8n data (workflows, credentials, execution history)
      - n8n_data:/home/node/.n8n
      # Mount repo directories for file access inside n8n execute-command nodes
      - ../data:/data
      - ../templates:/templates
      - ../prompts:/prompts
      - ../schemas:/schemas
      # Mount Python scripts so n8n execute-command nodes can call them
      - ../scripts:/repo/scripts
      - ../requirements.txt:/repo/requirements.txt

  # ─── nanoclaw: Claude Manager Agent (Discord) ──────────────────────────────
  nanoclaw:
    build:
      context: ../nanoclaw/app     # cloned by scripts/setup_nanoclaw.sh
      dockerfile: Dockerfile
    container_name: nycpolicyscope-nanoclaw
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      # Anthropic API key for Claude
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Discord bot credentials
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}

      # n8n webhook base (nanoclaw uses this to trigger workflows)
      - N8N_BASE_URL=http://n8n:5678
      - N8N_WEBHOOK_TOKEN=${N8N_WEBHOOK_TOKEN:-}

      # Nanoclaw group to load
      - NANOCLAW_GROUP=nycpolicyscope

    volumes:
      # Mount our group config so nanoclaw loads the manager CLAUDE.md
      - ../nanoclaw/groups:/app/groups:ro

volumes:
  n8n_data:
    driver: local
